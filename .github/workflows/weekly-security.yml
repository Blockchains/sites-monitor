name: weekly security (headers + exposed files)
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: pages-data-security
  cancel-in-progress: false
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
      - name: Security headers + /.env /.git probe
        run: python3 scripts/security.py --out pages/data
      - name: Publish JSON to gh-pages
        run: bash scripts/publish.sh "security $(date -u +%FT%TZ)"
      - name: Open / update / close issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/issues.py pages/data/findings-security.json
